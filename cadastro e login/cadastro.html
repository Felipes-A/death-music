<!DOCTYPE html>
<html lang="Pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro DEATH-MUSIC</title>
<link rel="stylesheet" href="cadastro.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="container-cadastro">
  <div class="auth-brand">
    <img src="../imagens/felipe logo principal.jpeg" alt="Death Music logo">
  </div>
  <h2>Criar Conta</h2>
  <form>
    <div class="campo-form">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
    </div>
    
    <div class="campo-form">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="email" required>
    </div>

    <div class="campo-form">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
    </div>

    <div class="google-signin-container">
      <div id="google-signin-button"></div>
      <p id="google-auth-status" class="google-auth-status" role="status" aria-live="polite"></p>
    </div>

    <p id="auth-message" role="status" aria-live="polite" hidden></p>
    <button type="submit" class="botao-vermelho">Cadastrar</button>
    <p class="login-link">Já tem uma conta? <a href="login.html">Faça login aqui</a></p>
  </form>
</div>
<script src="google-auth.js"></script>
<script src="auth.js"></script>
</body>

</html>
