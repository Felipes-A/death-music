<!DOCTYPE html>
<html lang="Pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login DEATH-MUSIC</title>
</head>
 <link rel="stylesheet" href="login.css">
<body>
     <div class="login-box">
        <h2>Login</h2>
        <form id="loginForm" action="../interface.html" method="get">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="email" required>
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="senha" required>
            </div>
            <div id="mensagem" style="margin-top: 10px; padding: 10px; display: none; border-radius: 5px;"></div>
            <button type="submit">Entrar</button>
            <p style="text-align: center; margin-top: 15px;">Não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
        </form>
    </div>

   

</body>
</html>
