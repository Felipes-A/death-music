<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>interface</title>
    <script src="https://kit.fontawesome.com/deb687aa38.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="interface.css">
</head>

<body>
    <div class="container">
        <nav class="sidebar">
            <div class="nav-logo">
                <i class="fa-solid fa-music"></i>
            </div>
            <div class="nav-library">
                <i class="fa-solid fa-book"></i>
                <p>sua biblioteca +</p>
            </div>
            <div class="nav-playlist">
                <h5>crie sua playlist</h5>
                <button>criar playlist</button>
            </div>
            <div class="nav-playlist">
                <h5>baixe sua musica</h5>
                <button>baixar musica</button>
                <a href="musica1.mp3" class="btn btn-download">⬇ Download</a>
            </div>
            <div class="nav-footer">
                <a href="#">legal</a>
                <a href="#">centro de privacidade</a>
                <a href="#">politica de privacidade</a>
                <a href="#">cookies</a>
                <a href="#">sobre anúncios</a>
                <a href="#">acessibilidade</a>
            </div>
            <button class="nav-lang-button">
                <i class="fa-solid fa-globe"></i>
                português Brasil
            </button>
        </nav>

        <main>
            <header>
                <i class="fa-solid fa-magnifying-glass"></i>
                <input placeholder="o que você quer ouvir?">
            </header>

            <section class="content">
                <h2>artistas</h2>
                <div class="artists-grid"></div>

                <h2>Álbuns</h2>
                <div class="albums-grid"></div>

                <div class="cards-container">
                    <div class="player-container">
                        <h2>DEVILS NEVER CRY</h2>
                        <p class="artista">スタッフロール</p>
                        <div class="button-group">
                            <button class="botaoPlay">▶ Tocar música</button>
                            <audio class="musica" loop preload="none">
                                <source src="audio/Capcom Sound Team - DEVILS NEVER CRY (スタッフロール) (SPOTISAVER).mp3" type="audio/mpeg">
                            </audio>
                        </div>
                    </div>

                    <div class="player-container">
                        <h2>Snot</h2>
                        <p class="artista">Stoopid</p>
                        <div class="button-group">
                            <button class="botaoPlay">▶ Tocar música</button>
                            <audio class="musica" loop preload="none">
                                <source src="audio/Snot - Stoopid (SPOTISAVER).mp3" type="audio/mpeg">
                            </audio>
                        </div>
                    </div>

                    <div class="player-container">
                        <h2>Diva</h2>
                        <p class="artista">Arc System Works</p>
                        <div class="button-group">
                            <button class="botaoPlay">▶ Tocar música</button>
                            <audio class="musica" loop preload="none">
                                <source src="audio/Arc System Works - Diva (SPOTISAVER).mp3" type="audio/mpeg">
                            </audio>
                        </div>
                    </div>

                    <div class="player-container">
                        <h2>I'm Not Edible</h2>
                        <p class="artista">Chris Vrenna</p>
                        <div class="button-group">
                            <button class="botaoPlay">▶ Tocar música</button>
                            <audio class="musica" loop preload="none">
                                <source src="audio/Chris Vrenna - I'm Not Edible (SPOTISAVER).mp3" type="audio/mpeg">
                            </audio>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
